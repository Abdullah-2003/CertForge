<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}CertForge{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <a class="brand" href="{{ url_for('dashboard') }}">CertForge</a>
        <nav aria-label="Main navigation">
            <a href="{{ url_for('dashboard') }}"{% if request.path == '/' %} aria-current="page"{% endif %}>Dashboard</a>
            <a href="{{ url_for('submit_request') }}"{% if request.path.startswith('/request') %} aria-current="page"{% endif %}>Request</a>
            <a href="{{ request.script_root }}/admin">Admin</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
